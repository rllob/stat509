# GitHub Pages site for STAT 509 practice (repo rllob/stat509 -> https://rllob.github.io/stat509/)
# Rebuild after adding or rebuilding a quiz or deck:  Rscript build_site.R   (then commit and push)
# quizzes: bank = the quiz-deck YAML (its built .html sits next to it); file = name under quizzes/
# decks:   src = the deck's one-file offline .html (manim-deck); file = name under decks/
# Public site: no homework answers (decks that work assigned problems stay local until after the due date).
title: "STAT509"
subtitle: "Introduction to Mathematical Statistics, Autumn 2026: practice quizzes and animated slides"
note: "Quizzes use spaced repetition; progress is saved in this browser. Slides: press → to step, F for full screen. Built from the course study guides; no homework answers."
sections:
  - heading: "Week 1: probability foundations"
    quizzes:
      - bank: ../stat509/problem_sets/W1/quiz/W1_quiz.yaml
        file: w1.html
    decks:
      - src: ../stat509/problem_sets/W1/media/sampling/sampling.html
        file: w1_sampling.html
        title: "At least one: sampling without replacement"
        sub: "The chain of conditional factors, the smallest m, and the binomial approximation"
      - src: ../stat509/problem_sets/W1/media/continuity/continuity.html
        file: w1_continuity.html
        title: "Growing events and the limit of probabilities"
        sub: "Nested events, the new pieces, telescoping sums, right-continuity of a CDF"
  - heading: "Calculus self-test"
    quizzes:
      - bank: ../stat509/problem_sets/selftest/quiz/selftest_quiz.yaml
        file: selftest.html
    decks:
      - src: ../stat509/problem_sets/selftest/media/integrals/integrals.html
        file: st_integrals.html
        title: "What an integral is, and why F(b) − F(a)"
        sub: "Area as a limit of rectangle sums, why the +C drops out, substitution"
      - src: ../stat509/problem_sets/selftest/media/parts/parts.html
        file: st_parts.html
        title: "Integration by parts"
        sub: "The product rule read backwards"
      - src: ../stat509/problem_sets/selftest/media/double/double.html
        file: st_double.html
        title: "Double integrals: add up strips"
        sub: "Draw the region, choose the order, set the limits"
      - src: ../stat509/problem_sets/selftest/media/series/series.html
        file: st_series.html
        title: "Infinite series"
        sub: "What a series is, and how to recognize one"
      - src: ../stat509/problem_sets/selftest/media/limits/limits.html
        file: st_limits.html
        title: "Limits of powers"
        sub: "Who wins the race?"
      - src: ../stat509/problem_sets/selftest/media/partials/partials.html
        file: st_partials.html
        title: "Partial derivatives"
        sub: "The slope of a slice"
      - src: ../stat509/problem_sets/selftest/media/loglik/loglik.html
        file: st_loglik.html
        title: "Flat points, logs and the score"
        sub: "Classifying flat points; the log-likelihood peaks where the likelihood does"
